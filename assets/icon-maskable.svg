<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable: OSes crop to a circle or squircle, so all meaningful content
       stays inside the central 60% safe zone and the field bleeds to the edge. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C8E52"/>
      <stop offset="100%" stop-color="#04502F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#field)"/>
  <path d="M20 340 C 130 306, 195 246, 275 214 S 420 162, 500 146"
        fill="none" stroke="#0A6E41" stroke-width="34" stroke-linecap="round"/>
  <path d="M256 168 L285 257 L379 257 L303 312 L332 401 L256 346 L180 401 L209 312 L133 257 L227 257 Z"
        fill="#F2C14E"/>
</svg>
